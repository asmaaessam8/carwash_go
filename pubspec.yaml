name: carwash_go
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8


  # UI
  google_nav_bar: ^5.0.6
  flutter_bloc: ^8.1.6
  lottie: ^2.7.0

  # Firebase
  firebase_core: ^4.7.0
  firebase_messaging: ^16.0.4
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0

  # Notifications
  googleapis_auth: 1.6.0
  http: ^1.2.2
  flutter_local_notifications: ^17.2.4

  # Auth
  google_sign_in: ^6.2.1

  # Images
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/keys/service_accpunt.json
    - assets/images/welcome_car.png
    - assets/images/logo.png
    - assets/animations/car_wash.json
    - assets/images/package_6.png
    - assets/images/package_12.png
    - assets/images/service_wash.jpeg
    - assets/images/service_interior.jpeg
    - assets/images/service_cleaning.jpeg
    - assets/images/service_addons.jpeg

  fonts:
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond-Regular.ttf